<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>恩備新規則｜想聽聽你的想法</title>
<style>
  :root {
    --bg: #f6f1ea; --card: #fffdf9; --ink: #2d2a26; --sub: #6f675e; --line: #e6ddd1;
    --accent: #3f6b57; --accent-soft: #e4eee8; --warm: #c9824a; --warm-soft: #f7e9dc; --field: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1b19; --card: #262320; --ink: #ece6dd; --sub: #a99f93; --line: #3b3631;
      --accent: #8cc2a6; --accent-soft: #2c3a33; --warm: #e0a477; --warm-soft: #3a2f26; --field: #2e2a26; }
    .btn.primary { color: #1d1b19; }
    nav { background: rgba(29,27,25,.96) !important; }
  }
  @media (min-width: 760px) {
    html, body { font-size: 18px; }
    .wrap, header .inner, nav .inner { max-width: 720px; }
    .card { padding: 30px 34px; }
    h1 { font-size: 28px; }
    .qtext { font-size: 20px; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    font-size: 17px; line-height: 1.7; -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 620px; margin: 0 auto; padding: 18px 16px 120px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line); }
  header .inner { max-width: 620px; margin: 0 auto; }
  .crumb { display: flex; justify-content: space-between; font-size: 13px; color: var(--sub); }
  .segs { display: flex; gap: 5px; margin-top: 8px; }
  .seg { flex: 1; height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .seg.here { height: 8px; margin-top: -1px; }
  .seg > i { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .35s ease; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px; margin-top: 18px;
    box-shadow: 0 1px 2px rgba(60,40,20,.04), 0 6px 18px rgba(60,40,20,.05); }
  .eyebrow { font-size: 13px; letter-spacing: .08em; color: var(--accent); font-weight: 600; }
  h1 { font-size: 24px; line-height: 1.4; margin: 6px 0 12px; }
  h2 { font-size: 20px; line-height: 1.45; margin: 6px 0 12px; }
  p { margin: 0 0 12px; }
  .lead { font-size: 18px; }
  .muted { color: var(--sub); font-size: 15px; }
  .box { background: var(--accent-soft); border-radius: 14px; padding: 14px 16px; margin: 14px 0; }
  .box.warm { background: var(--warm-soft); }
  .box b { display: block; margin-bottom: 4px; }
  ul.points { margin: 6px 0 0; padding-left: 1.2em; }
  ul.points li { margin: 4px 0; }
  .qtext { font-size: 18px; margin-bottom: 16px; }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt { display: flex; align-items: center; gap: 12px; min-height: 54px; text-align: left; font: inherit; font-size: 17px; padding: 12px 16px; border-radius: 14px; border: 1.5px solid var(--line);
    background: var(--field); color: var(--ink); cursor: pointer; transition: border-color .15s, background .15s; -webkit-tap-highlight-color: transparent; }
  .opt .dot { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #b9ab99; position: relative; }
  .opt.on .dot { border-color: var(--accent); }
  .opt.on .dot::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); }
  strong.ask { display: block; margin-top: 8px; color: var(--accent); }
  .rt2 { display: block; color: var(--sub); font-size: 15px; }
  .saved.ok { color: var(--accent); }
  body.typing nav { position: static; background: transparent; border-top: 0; }
  .opt:hover { border-color: #cdbfae; }
  .opt.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .grid-row { padding: 14px 0; border-top: 1px dashed var(--line); }
  .grid-row:first-of-type { border-top: 0; padding-top: 4px; }
  .grid-row .rt { font-size: 16px; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: inherit; font-size: 15px; padding: 9px 14px; min-height: 40px; -webkit-tap-highlight-color: transparent; border-radius: 999px; border: 1.5px solid var(--line); background: var(--field); cursor: pointer; color: var(--ink); }
  .chip.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .note { margin-top: 14px; }
  .note label { display: block; font-size: 15px; color: var(--sub); margin-bottom: 6px; }
  textarea, input[type=text] { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--field); color: var(--ink); }
  textarea { min-height: 90px; resize: vertical; }
  textarea:focus, input[type=text]:focus { outline: none; border-color: var(--accent); }
  .linkbtn { background: none; border: 0; color: var(--accent); font: inherit; font-size: 15px; padding: 10px 0 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(246,241,234,.96); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  nav .inner { max-width: 620px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .btn { font: inherit; font-size: 16px; font-weight: 600; padding: 13px 20px; border-radius: 14px; border: 0; cursor: pointer; }
  .btn.primary { background: var(--accent); color: #fff; flex: 1; }
  .btn.ghost { background: transparent; color: var(--sub); border: 1.5px solid var(--line); }
  .btn:disabled { opacity: .5; cursor: default; }
  .saved { font-size: 13px; color: var(--sub); min-width: 4.5em; text-align: center; }
  .sec-list { list-style: none; padding: 0; margin: 10px 0 0; }
  .sec-list li { display: flex; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--line); font-size: 16px; }
  .sec-list li span:last-child { color: var(--sub); font-size: 14px; }
  .sec-list li.done span:first-child::after { content: "　已完成"; color: var(--accent); font-size: 13px; }
  .center { text-align: center; }
  .big { font-size: 44px; line-height: 1; margin: 6px 0 8px; }
  .testflag { background: #8a3b2a; color: #fff; text-align: center; font-size: 13px; padding: 4px; }
  .fade { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  /* 專注版 */
  .card { border: 0; box-shadow: none; background: transparent; padding: 8px 4px; margin-top: 10px; }
  .fade { animation: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  .eyebrow { color: var(--sub); font-weight: 400; letter-spacing: 0; }
  header { border-bottom: 0; }
  .crumb { font-size: 14px; }
  .qline { margin: 0 0 10px; font-size: 18px; line-height: 1.75; }
  .qask { display: block; margin-top: 14px; font-size: 19px; font-weight: 700; color: var(--ink); }
  .opt { min-height: 58px; }
  details.more { margin-top: 14px; }
  details.more summary { color: var(--accent); cursor: pointer; font-size: 15px; padding: 8px 0; }
  details.more[open] summary { margin-bottom: 8px; }
  .ask-big { font-size: 20px; font-weight: 600; line-height: 1.6; margin: 10px 0 6px; }
  .btn.ghost { border: 0; padding-left: 4px; padding-right: 4px; text-decoration: underline; text-underline-offset: 3px; font-weight: 400; }
  .saved { min-width: 0; }
  .savefail { border: 1px solid var(--warm); }
</style>
</head>
<body>
<div id="testflag"></div>
<header><div class="inner">
  <div class="crumb"><span id="crumbL">開始</span><span id="crumbR"></span></div>
  <div class="segs" id="segs"></div>
</div></header>
<div class="wrap"><div id="stage"><div class="card"><p class="muted">載入中…</p></div></div></div>
<nav><div class="inner">
  <button class="btn ghost" id="backBtn">上一步</button>
  <span class="saved" id="savedMark"></span>
  <button class="btn primary" id="nextBtn">開始</button>
</div></nav>
<script>
var HASH = location.hash.replace(/^#/, '').split('&');
var DEPLOY = HASH[0] || '';
var TEST = HASH.indexOf('test') > 0;
var API = DEPLOY ? 'https://script.google.com/macros/s/' + DEPLOY + '/exec' : '';
var DATA = null, SECS = [];
var ACCEPT = ['你想這樣我就配合', '你想做我就配合', '你決定就好', '你挑好告訴我就好', '你排就好，我配合', '你覺得可以我就配合'];
var ans = {};        // id -> {v: string|array, n: string}
var dirty = {};      // id -> true
var pages = [];
var cur = 0;
var totalQ = 0;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function clean(c) { return c.replace(/（寫在想說的話）/g, ''); }
function get(id) { return ans[id] || (ans[id] = {v: '', n: ''}); }
function setV(id, v) { get(id).v = v; dirty[id] = true; }
function setN(id, n) { get(id).n = n; dirty[id] = true; }
function mins(n) { return Math.max(2, Math.round(n * 0.6)); }

function buildPages() {
  pages.push({t: 'welcome'});
  SECS.forEach(function (s, si) {
    pages.push({t: 'intro', s: si});
    s.items.forEach(function (q, qi) { pages.push({t: 'q', s: si, q: qi}); totalQ++; });
    pages.push({t: 'secnote', s: si});
    pages.push({t: si === SECS.length - 1 ? 'end' : 'rest', s: si});
  });
}
function qIndex(p) { // 1-based overall question number for progress
  var n = 0;
  for (var i = 0; i <= cur && i < pages.length; i++) if (pages[i].t === 'q') n++;
  return n;
}
function secDone(si) {
  return SECS[si].items.every(function (q) { return isAnswered(q); });
}
function isAnswered(q) {
  if (q.type === '方格') return q.rows.every(function (r, ri) { return get(q.id + '｜列 ' + (ri + 1)).v; });
  var v = get(q.id).v; return Array.isArray(v) ? v.length > 0 : !!v;
}

function drawSegs() {
  var p0 = pages[cur], h = '';
  if (p0.t === 'welcome' || p0.t === 'end') { document.getElementById('segs').innerHTML = ''; return; }
  var sx = SECS[p0.s], seen0 = 0;
  for (var i0 = 0; i0 <= cur; i0++) if (pages[i0].t === 'q' && pages[i0].s === p0.s) seen0++;
  document.getElementById('segs').innerHTML = '<div class="seg here"><i style="width:' + Math.round(seen0 / sx.items.length * 100) + '%"></i></div>';
  return;
  SECS.forEach(function (s, si) {
    var seen = 0;
    for (var i = 0; i <= cur; i++) if (pages[i].t === 'q' && pages[i].s === si) seen++;
    var here = pages[cur].s === si && pages[cur].t !== 'welcome';
    h += '<div class="seg' + (here ? ' here' : '') + '"><i style="width:' + Math.round(seen / s.items.length * 100) + '%"></i></div>';
  });
  document.getElementById('segs').innerHTML = h;
}
function qHtml(t) {
  var parts = String(t).replace(/([。；？])/g, '$1\n').split('\n').map(function (x) { return x.trim(); }).filter(Boolean), out = '';
  parts.forEach(function (x) { out += /？$/.test(x) ? '<span class="qask">' + esc(x) + '</span>' : '<p class="qline">' + esc(x) + '</p>'; });
  return out;
}
function qHtmlOld(t) {
  var m = t.match(/^(.*[。」）])([^。]*？)$/);
  return m ? esc(m[1]) + '<strong class="ask">' + esc(m[2]) + '</strong>' : esc(t);
}
function render(keep) {
  var p = pages[cur], st = document.getElementById('stage');
  var html = '';
  var back = document.getElementById('backBtn'), next = document.getElementById('nextBtn');
  back.style.visibility = cur === 0 ? 'hidden' : 'visible';
  next.textContent = '下一步';
  var done = qIndex();
  drawSegs();
  document.getElementById('crumbR').textContent = (p.t === 'q') ? ('這一段 第 ' + (p.q + 1) + '／' + SECS[p.s].items.length + ' 題') : '';

  if (p.t === 'welcome') {
    var W = DATA.welcome;
    document.getElementById('crumbL').textContent = '開始';
    html += '<div class="card fade"><div class="eyebrow">恩備的新規則</div><h1>' + esc(W.title) + '</h1>';
    W.paras.forEach(function (x) { html += '<p class="lead">' + esc(x) + '</p>'; });
    html += '<p class="ask-big">一共 ' + SECS.length + ' 段，一次填一段就好，關掉再打開會接著填。</p>';
    html += '<details class="more"><summary>怎麼填、填完之後（選讀）</summary><ul class="points">';
    W.how.forEach(function (x) { html += '<li>' + esc(x) + '</li>'; });
    html += '</ul><p>' + esc(W.after) + '</p></details></div>';
    next.textContent = hasAny() ? '從上次的地方繼續' : '開始';
  } else if (p.t === 'intro') {
    var s = SECS[p.s];
    document.getElementById('crumbL').textContent = '第 ' + (p.s + 1) + ' 段／共 ' + SECS.length + ' 段';
    html += '<div class="card fade"><div class="eyebrow">第 ' + (p.s + 1) + ' 段・' + s.items.length + ' 題・約 ' + mins(s.items.length) + ' 分鐘</div><h1>' + esc(s.name) + '</h1>';
    html += '<p class="ask-big">' + esc(s.ask) + '</p>';
    html += '<details class="more"><summary>想先看前因後果（選讀）</summary>';
    s.intro.split('\n').forEach(function (x) { html += '<p>' + esc(x) + '</p>'; });
    html += '</details></div>';
    next.textContent = '開始這一段';
  } else if (p.t === 'q') {
    var s2 = SECS[p.s], q = s2.items[p.q];
    document.getElementById('crumbL').textContent = s2.name;
    html += '<div class="card">';
    html += '<div class="qtext">' + qHtml(q.text) + '</div>' + renderQ(q) + '</div>';
  } else if (p.t === 'secnote') {
    var s3 = SECS[p.s], nid = s3.key + '｜本段想說的話';
    document.getElementById('crumbL').textContent = '第 ' + (p.s + 1) + ' 段・' + s3.name;
    html += '<div class="card fade"><div class="eyebrow">這一段的最後</div><h2>關於「' + esc(s3.name) + '」，還有什麼想說的嗎？</h2>';
    html += '<p class="muted">任何感覺都可以：哪裡怪怪的、哪裡你做不到、哪裡你其實很想要。沒有也沒關係，直接按下一步。</p>';
    html += '<textarea data-note="' + esc(nid) + '" placeholder="選填">' + esc(get(nid).n) + '</textarea></div>';
  } else if (p.t === 'rest') {
    var s4 = SECS[p.s], nx = SECS[p.s + 1];
    document.getElementById('crumbL').textContent = '休息一下';
    html += '<div class="card fade center"><div class="big">☕</div><h1>第 ' + (p.s + 1) + ' 段完成了，謝謝你</h1>';
    html += '<p>你的回答已經存好了。想先休息，可以直接關掉這個頁面，下次打開同一個連結，會從下一段接著填。</p></div>';
    html += '<p class="muted center">下一段：' + esc(nx.name) + '（' + nx.items.length + ' 題）</p>';
    next.textContent = '繼續下一段';
  } else if (p.t === 'end') {
    document.getElementById('crumbL').textContent = '完成';
    html += '<div class="card fade center"><div class="big">🌱</div><h1>全部填完了，真的謝謝你</h1>';
    html += '<p>' + esc(DATA.welcome.after) + '</p>';
    html += '<p class="muted">之後想改答案，再打開同一個連結就能改，改完一樣會存起來。</p></div>';
    var miss = [];
    SECS.forEach(function (s5, si) { s5.items.forEach(function (q5, qi) { if (!isAnswered(q5)) miss.push({si: si, qi: qi, s: s5, q: q5}); }); });
    if (miss.length) {
      html += '<div class="card"><div class="eyebrow">還沒選的題目（' + miss.length + ' 題）</div><p class="muted">不想答可以留空，想補的話點一下就會跳過去。</p><ul class="sec-list">';
      miss.slice(0, 20).forEach(function (m) { html += '<li><button class="linkbtn" data-jump="' + m.si + ',' + m.qi + '">' + esc(m.s.name + '・第 ' + (m.qi + 1) + ' 題・' + m.q.short) + '</button></li>'; });
      html += '</ul></div>';
    }
    next.textContent = '回到開頭';
  }
  st.innerHTML = html;
  bind();
  if (!keep) window.scrollTo(0, 0);
}

function noteBox(id, label, open) {
  var n = get(id).n;
  if (!open && !n) return '<div class="note"><button class="linkbtn" data-open="' + esc(id) + '">補一句（選填）</button></div>';
  return '<div class="note"><label>' + esc(label) + '</label><textarea data-note="' + esc(id) + '" placeholder="選填">' + esc(n) + '</textarea></div>';
}
function labelFor(choice) {
  if (!choice) return '想補充的話（選填）';
  if (/寫在想說的話/.test(choice)) return '想怎麼改，或是哪裡做不到？';
  if (ACCEPT.indexOf(choice) >= 0) return '如果你願意，說一句：是你自己也想要，還是覺得我想做所以配合？兩種都可以，我只是想知道。';
  if (choice === '其他') return '你想怎麼做？';
  return '想補充的話（選填）';
}
function needsNote(choice) { return /寫在想說的話/.test(choice) || ACCEPT.indexOf(choice) >= 0 || choice === '其他'; }

function renderQ(q) {
  var h = '', a = get(q.id);
  if (q.type === '單選' || q.type === '單選加簡答') {
    var ch = q.choices.slice(); if (q.other) ch.push('其他');
    h += '<div class="opts">';
    ch.forEach(function (c) { h += '<button class="opt' + (a.v === c ? ' on' : '') + '" data-single="' + esc(q.id) + '" data-val="' + esc(c) + '"><span class="dot"></span><span>' + esc(clean(c)) + '</span></button>'; });
    h += '</div>';
    if (q.type === '單選加簡答') {
      var f1 = get(q.id + '｜是哪一件'), f2 = get(q.id + '｜怎麼帶');
      if (a.v === q.choices[0]) {
        h += '<div class="note"><label>' + esc(q.followText) + '</label><input type="text" data-val-text="' + esc(q.id + '｜是哪一件') + '" value="' + esc(f1.v) + '" placeholder="例如：一起做餅乾、第一次搭船"></div>';
        h += '<div class="note"><label>這件你想怎麼帶？</label><div class="chips">';
        q.followChoice.forEach(function (c) { h += '<button class="chip' + (f2.v === c ? ' on' : '') + '" data-single="' + esc(q.id + '｜怎麼帶') + '" data-val="' + esc(c) + '">' + esc(c) + '</button>'; });
        h += '</div></div>';
      }
    }
    h += noteBox(q.id, labelFor(a.v), needsNote(a.v));
  } else if (q.type === '複選') {
    var arr = Array.isArray(a.v) ? a.v : [];
    h += '<p class="muted">可以選很多個。</p><div class="chips">';
    q.choices.forEach(function (c) { h += '<button class="chip' + (arr.indexOf(c) >= 0 ? ' on' : '') + '" data-multi="' + esc(q.id) + '" data-val="' + esc(c) + '">' + esc(clean(c)) + '</button>'; });
    h += '</div>' + noteBox(q.id, '想補充的話（選填）', false);
  } else if (q.type === '簡答') {
    h += '<textarea data-val-text="' + esc(q.id) + '" placeholder="寫幾個字就好">' + esc(a.v) + '</textarea>';
  } else if (q.type === '方格') {
    h += '<p class="muted">每一條選一個。</p>';
    q.rows.forEach(function (r, ri) {
      var rid = q.id + '｜列 ' + (ri + 1), rv = get(rid).v;
      var parts = r.split(' → ');
      h += '<div class="grid-row"><div class="rt"><b>' + esc(parts[0]) + '</b>' + (parts[1] ? '<span class="rt2">' + esc(parts[1]) + '</span>' : '') + '</div><div class="chips">';
      q.cols.forEach(function (c) { h += '<button class="chip' + (rv === c ? ' on' : '') + '" data-single="' + esc(rid) + '" data-val="' + esc(c) + '">' + esc(c) + '</button>'; });
      h += '</div></div>';
    });
    var anyAcc = q.rows.some(function (r, ri) { var v = get(q.id + '｜列 ' + (ri + 1)).v; return v && v !== q.cols[0]; });
    h += noteBox(q.id + '｜補充', '哪幾條想怎麼調整，或為什麼這樣選？（選填）', anyAcc);
  }
  return h;
}

function bind() {
  var st = document.getElementById('stage');
  st.querySelectorAll('[data-single]').forEach(function (b) { b.onclick = function () {
    var had = !!st.querySelector('textarea[data-note]');
    setV(b.dataset.single, b.dataset.val); render(true);
    var ta = document.getElementById('stage').querySelector('.opts ~ .note textarea, .opts ~ .note input');
    if (ta && !had && ta.scrollIntoView) ta.scrollIntoView({behavior: 'smooth', block: 'center'}); }; });
  st.querySelectorAll('[data-multi]').forEach(function (b) { b.onclick = function () {
    var id = b.dataset.multi, v = Array.isArray(get(id).v) ? get(id).v.slice() : [], i = v.indexOf(b.dataset.val);
    if (i >= 0) v.splice(i, 1); else v.push(b.dataset.val);
    setV(id, v); render(true); }; });
  st.querySelectorAll('[data-open]').forEach(function (b) { b.onclick = function () {
    var div = b.parentNode, id = b.dataset.open;
    div.innerHTML = '<label>想補充的話（選填）</label><textarea data-note="' + esc(id) + '" placeholder="選填"></textarea>';
    var ta = div.querySelector('textarea'); ta.oninput = function () { setN(id, ta.value); }; ta.focus(); }; });
  st.querySelectorAll('textarea[data-note]').forEach(function (t) { t.oninput = function () { setN(t.dataset.note, t.value); }; });
  st.querySelectorAll('[data-val-text]').forEach(function (t) { t.oninput = function () { setV(t.dataset.valText, t.value); }; });
  st.querySelectorAll('[data-jump]').forEach(function (b) { b.onclick = function () {
    var x = b.dataset.jump.split(','), si = +x[0], qi = +x[1];
    for (var i = 0; i < pages.length; i++) if (pages[i].t === 'q' && pages[i].s === si && pages[i].q === qi) { go(i); return; } }; });
}

function hasAny() { for (var k in ans) { var v = ans[k].v; if ((Array.isArray(v) ? v.length : v) || ans[k].n) return true; } return false; }

var saving = false;
function ser(id) { var a = get(id); return (Array.isArray(a.v) ? a.v.join('、') : a.v) + '\u0001' + a.n; }
function save(cb) {
  var items = [], sent = {};
  for (var id in dirty) { var a = ans[id]; items.push({id: id, v: Array.isArray(a.v) ? a.v.join('、') : a.v, n: a.n}); sent[id] = ser(id); }
  var mark = document.getElementById('savedMark');
  if (!items.length) { cb && cb(); return; }
  saving = true;
  fetch(API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({test: TEST, items: items, pos: cur})})
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res || !res.ok) throw new Error((res && res.error) || 'save failed');
      for (var k in sent) if (ser(k) === sent[k]) delete dirty[k]; saving = false; mark.textContent = ''; var f = document.querySelector('.savefail'); if (f) f.remove(); cb && cb(); })
    .catch(function () { saving = false; mark.textContent = '沒存到'; alertBox(); cb && cb(); });
}
function alertBox() {
  var st = document.getElementById('stage');
  if (st.querySelector('.savefail')) return;
  var d = document.createElement('div'); d.className = 'card savefail box warm';
  d.innerHTML = '<b>剛剛沒有存到</b>可能是網路斷了。答案還在這個頁面上，網路恢復後按「下一步」會再存一次。';
  st.insertBefore(d, st.firstChild);
}
function go(i) {
  save(function () {});
  cur = Math.max(0, Math.min(pages.length - 1, i));
  render();
}
document.getElementById('nextBtn').onclick = function () {
  var p = pages[cur];
  if (p.t === 'welcome' && hasAny() && DATA.pos > 0) { go(DATA.pos); DATA.pos = 0; return; }
  if (p.t === 'end') { go(0); return; }
  go(cur + 1);
};
document.getElementById('backBtn').onclick = function () { go(cur - 1); };
document.addEventListener('focusin', function (e) { if (/TEXTAREA|INPUT/.test(e.target.tagName)) document.body.classList.add('typing'); });
document.addEventListener('focusout', function () { setTimeout(function () { if (!/TEXTAREA|INPUT/.test((document.activeElement || {}).tagName || '')) document.body.classList.remove('typing'); }, 50); });
function beacon() {
  if (!API || !DATA || !Object.keys(dirty).length || !navigator.sendBeacon) return;
  var items = [];
  for (var id in dirty) { var a = ans[id]; items.push({id: id, v: Array.isArray(a.v) ? a.v.join('、') : a.v, n: a.n}); }
  if (navigator.sendBeacon(API, new Blob([JSON.stringify({test: TEST, items: items, pos: cur})], {type: 'text/plain;charset=utf-8'}))) dirty = {};
}
window.addEventListener('pagehide', beacon);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') beacon(); });

function stop(title, msg) {
  document.querySelector('nav').style.display = 'none';
  document.getElementById('stage').innerHTML = '<div class="card center"><div class="big">🔗</div><h1>' + esc(title) + '</h1><p>' + esc(msg) + '</p></div>';
}
if (TEST) document.getElementById('testflag').innerHTML = '<div class="testflag">測試模式：回答寫進「測試」分頁，不算數</div>';
if (!API) stop('連結不完整', '這個連結少了後面一段。請回到原本傳給你的訊息，整段複製再打開一次。');
else fetch(API + '?api=load' + (TEST ? '&mode=test' : ''))
  .then(function (r) { return r.json(); })
  .then(function (st) {
    DATA = st; SECS = st.sections; buildPages();
    (st.rows || []).forEach(function (r) {
      var v = r.v;
      if (v && /｜第 \d+ 題$/.test(r.id)) {
        var q = findQ(r.id); if (q && q.type === '複選') v = String(v).split('、');
      }
      ans[r.id] = {v: v || '', n: r.n || ''};
    });
    DATA.pos = st.pos || 0;
    render();
  })
  .catch(function () { stop('問卷暫時打不開', '可能是網路不穩。等一下再重新整理這個頁面；一直打不開的話跟我說一聲。'); });
function findQ(id) { for (var i = 0; i < SECS.length; i++) for (var j = 0; j < SECS[i].items.length; j++) if (SECS[i].items[j].id === id) return SECS[i].items[j]; return null; }
</script>
</body>
